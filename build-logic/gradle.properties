# These mirror the root `gradle.properties`, and they are not redundant.
#
# To generate type-safe accessors for a precompiled script plugin, Gradle applies that script's
# plugins to a synthetic probe project. The probe belongs to *this* build, not the main one, so
# it never sees the root properties — and with `android.builtInKotlin` left at its AGP 9 default
# of `true`, applying `org.jetbrains.kotlin.android` fails outright with "no longer required
# since AGP 9.0". The main build works because it does set the flag; only accessor generation
# breaks, which makes it look like a plugin incompatibility rather than a missing property.
#
# Keep in step with the root file. Revisit both when AGP stabilises KMP support.
android.builtInKotlin=false
android.newDsl=false
