name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. With `branches: [main]` a pull request targeting anything else got
  # no checks at all — so a stacked PR, whose whole point is to be verified before its parent
  # merges, was the one case that went unverified.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # These jobs execute repository-controlled Gradle code. Leaving GITHUB_TOKEN in the
          # git config would let a malicious build script read it back out.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` depends on `check`, which already runs every JVM/KMP test task
      # (`jvmTest`, `testDebugUnitTest`, ...) plus Android Lint.
      - name: Build and run JVM tests
        run: ./gradlew build

      # Fails when a library's compiled ABI drifts from the dumps in `api/`. Run explicitly
      # rather than relying on it being wired into `check`, so a change in that wiring cannot
      # silently drop the guarantee.
      - name: Check published API surface
        run: ./gradlew checkKotlinAbi

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]

    steps:
      - uses: actions/checkout@v6
        with:
          # These jobs execute repository-controlled Gradle code. Leaving GITHUB_TOKEN in the
          # git config would let a malicious build script read it back out.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Compose runtime behaviour under test (backstack save/restore, result
      # delivery, event-sink lifecycle) only exists on a device, so these suites
      # are the ones that actually cover trapeze-navigation.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore
